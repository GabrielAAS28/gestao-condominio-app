version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    groups:
      react-navigation:
        patterns: ['@react-navigation/*']
      react-native-core:
        patterns: ['react-native', '@react-native/*', '@react-native-community/*']
      types-e-lint:
        patterns: ['@types/*', 'eslint*', 'prettier', 'jest', 'babel*', '@babel/*']
    ignore:
      # Bump de major do RN exige upgrade guiado (upgrade-helper), nunca automatico.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['ci']

  - package-ecosystem: gradle
    directory: '/android'
    schedule:
      interval: monthly
    labels: ['android']
