name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least privilege: o default do workflow e so leitura. Escrita em
# security-events fica no job que realmente publica alertas (codeql).
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: '/language:javascript-typescript'

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # INFORMATIVO POR ENQUANTO — nao bloqueia o merge.
      #
      # O backlog de vulnerabilidades e anterior a este pipeline. Boa parte
      # vem da arvore do React Native/Metro e so sai com upgrade do RN, que
      # exige o upgrade-helper e nao cabe num PR de dependencia.
      #
      # O resumo abaixo aparece em todo PR, entao a divida fica visivel.
      # Depois da PR de remediacao, troque o `exit 0` final por `exit $CODE`
      # para tornar o check bloqueante.
      - name: npm audit (dependencias de producao)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high
          CODE=$?
          npm audit --omit=dev --json > audit.json 2>/dev/null
          set -e
          node -e "
            const j = JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const m = j.metadata.vulnerabilities;
            const graves = Object.values(j.vulnerabilities || {})
              .filter(v => ['high','critical'].includes(v.severity))
              .sort((a,b) => (a.severity === 'critical' ? -1 : 1));
            console.log('### Dependency Audit — dependencias de producao');
            console.log('');
            console.log('critical: ' + m.critical + ' &nbsp;|&nbsp; high: ' + m.high +
                        ' &nbsp;|&nbsp; moderate: ' + m.moderate + ' &nbsp;|&nbsp; low: ' + m.low);
            console.log('');
            if (graves.length) {
              console.log('| severidade | pacote | correcao |');
              console.log('|---|---|---|');
              graves.forEach(v => {
                const major = v.fixAvailable && v.fixAvailable.isSemVerMajor;
                console.log('| ' + v.severity + ' | \`' + v.name + '\` | ' +
                            (major ? '**upgrade major** (breaking)' : '\`npm audit fix\`') + ' |');
              });
              console.log('');
              console.log('> Check informativo: nao bloqueia o merge. Ver nota em .github/workflows/security.yml');
            }
          " >> "$GITHUB_STEP_SUMMARY"
          echo "exit code real do npm audit: $CODE (nao bloqueia por decisao explicita)"
          exit 0

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
