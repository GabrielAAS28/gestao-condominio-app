name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------
  # 1) Lint, tipos e testes
  # ---------------------------------------------------------------
  quality:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Evita que o GITHUB_TOKEN fique gravado em .git/config,
          # onde qualquer step seguinte (inclusive postinstall de
          # dependencia) conseguiria ler.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `lint:ci` usa um orcamento de warnings (--max-warnings) travado no
      # numero atual: erros novos e warnings novos quebram o build, mas o
      # backlog existente nao bloqueia o time. Baixe o numero conforme limpar.
      - name: ESLint
        run: npm run lint:ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Testes (Jest)
        run: npm run test:ci

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2) Bundle Metro + compilacao Hermes
  #    Pega import quebrado / modulo faltando que o ESLint nao ve, e
  #    valida que o bundle compila para o motor Hermes (hermesEnabled=true).
  # ---------------------------------------------------------------
  bundle:
    name: Metro Bundle + Hermes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Evita que o GITHUB_TOKEN fique gravado em .git/config,
          # onde qualquer step seguinte (inclusive postinstall de
          # dependencia) conseguiria ler.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar bundle de producao (Android)
        run: |
          mkdir -p build/bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/bundle/index.android.bundle \
            --assets-dest build/bundle

      - name: Compilar o bundle com Hermes
        run: |
          set -euo pipefail
          HERMESC="node_modules/react-native/sdks/hermesc/linux64-bin/hermesc"
          # Falha de proposito se o binario sumir. Um upgrade do React Native
          # pode mover esse caminho, e um check que se auto-pula em silencio
          # daria a impressao de que o bundle continua sendo validado.
          if [ ! -x "$HERMESC" ]; then
            echo "::error::hermesc nao encontrado em $HERMESC."
            echo "Se o caminho mudou apos um upgrade do RN, atualize este step."
            ls -R node_modules/react-native/sdks/hermesc 2>/dev/null || true
            exit 1
          fi
          "$HERMESC" -emit-binary -out build/bundle/index.android.hbc \
            build/bundle/index.android.bundle
          ls -lh build/bundle/index.android.hbc

      - name: Upload do bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-bundle
          path: build/bundle/
          retention-days: 5

  # ---------------------------------------------------------------
  # 3) Build do APK Android
  # ---------------------------------------------------------------
  android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    # Compila C++ nativo para duas ABIs (New Architecture); o primeiro run,
    # sem cache do Gradle, e o mais demorado.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Evita que o GITHUB_TOKEN fique gravado em .git/config,
          # onde qualquer step seguinte (inclusive postinstall de
          # dependencia) conseguiria ler.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (com cache)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Instalar dependencias
        run: npm ci

      # ATENCAO: o template padrao do RN assina o release com a debug.keystore
      # (android/app/build.gradle). Este APK serve para teste interno, NAO
      # para publicar na Play Store. Veja o README de CI para assinar de verdade.
      # Com newArchEnabled=true, o CMake do :app faz add_subdirectory nos
      # diretorios de codegen JNI de cada biblioteca autolinkada
      # (async-storage, gesture-handler, image-picker, vector-icons...).
      # Num checkout limpo esses diretorios ainda nao existem quando o
      # :app:configureCMake roda, e o build morre com CXX1429.
      # Gerar o codegen em todos os modulos antes resolve a ordem.
      - name: Gerar codegen da New Architecture
        working-directory: android
        run: ./gradlew generateCodegenArtifactsFromSchema --no-daemon

      - name: Gradle assembleRelease
        working-directory: android
        # As arquiteturas sao forcadas aqui de proposito: o gradle.properties
        # local pode estar com 'reactNativeArchitectures=x86_64' (atalho para
        # emulador no Windows). Um APK so-x86_64 NAO roda em celular real,
        # entao o CI ignora esse valor e sempre gera para ARM.
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Localizar APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK gerado."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload do APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

  # ---------------------------------------------------------------
  # 4) Gate unico: use ESTE check na branch protection
  # ---------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [quality, bundle, android]
    if: always()
    steps:
      - name: Falhar se qualquer job anterior falhou
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "bundle:  ${{ needs.bundle.result }}"
          echo "android: ${{ needs.android.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.bundle.result }}" != "success" ] || \
             [ "${{ needs.android.result }}" != "success" ]; then
            echo "::error::Um ou mais checks de CI falharam. Merge bloqueado."
            exit 1
          fi
          echo "Todos os checks passaram."
